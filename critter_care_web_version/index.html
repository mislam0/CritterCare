<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f3e9">
  <title>CritterCare</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #f7f3e9; }
    body { color: #35493e; font-family: ui-rounded, "Segoe UI", system-ui, sans-serif; }
    #canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #f7f3e9; }
    .card { width: min(440px, 90vw); padding: 32px; text-align: center; }
    .critter { width: 94px; height: 94px; margin-bottom: 14px; }
    h1 { font-size: clamp(28px, 6vw, 40px); letter-spacing: -1px; margin: 0 0 12px; }
    p { line-height: 1.6; margin: 0 0 20px; color: #687a69; }
    progress { width: 100%; height: 12px; border: none; border-radius: 8px; overflow: hidden; accent-color: #426d53; background: #e7edde; }
    progress::-webkit-progress-bar { background: #e7edde; border-radius: 8px; }
    progress::-webkit-progress-value { background: #426d53; border-radius: 8px; }
    #notice { white-space: pre-line; font-size: 15px; color: #875343; }
    #retry { background: #426d53; color: #fffdf7; padding: 12px 24px; border: 0; border-radius: 12px; font-size: 17px; cursor: pointer; }
    noscript { position: fixed; inset: 0; padding: 20vh 10vw; text-align: center; background: #f7f3e9; z-index: 10; }
    [hidden] { display: none !important; }
  </style>
  <link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
  <canvas id="canvas" tabindex="0" aria-label="CritterCare game. Click Pip's head to pet him; hold and drag to carry him.">Your browser needs canvas support to play CritterCare.</canvas>
  <div id="loading" role="status" aria-live="polite">
    <div class="card">
      <svg class="critter" viewBox="0 0 128 128" aria-hidden="true"><rect width="128" height="128" rx="32" fill="#e7edde"/><g fill="#c89566" stroke="#77563e" stroke-width="3"><circle cx="33" cy="34" r="18"/><circle cx="95" cy="34" r="18"/><ellipse cx="64" cy="73" rx="44" ry="42"/></g><g fill="#efb4a2"><circle cx="33" cy="34" r="10"/><circle cx="95" cy="34" r="10"/></g><ellipse cx="64" cy="87" rx="31" ry="23" fill="#fff0d7"/><g fill="#3d302b"><ellipse cx="46" cy="66" rx="5" ry="7"/><ellipse cx="82" cy="66" rx="5" ry="7"/></g><g fill="#fff"><circle cx="47" cy="64" r="2"/><circle cx="83" cy="64" r="2"/></g><path d="M59 81Q64 76 69 81L64 87Z" fill="#ab7365"/><path d="M55 91Q64 99 73 91" fill="none" stroke="#77563e" stroke-width="3" stroke-linecap="round"/></svg>
      <h1>CritterCare</h1>
      <p id="loading-label">Getting Pip's little room ready…</p>
      <progress id="progress" aria-label="Loading game"></progress>
      <p id="notice" hidden></p>
      <button id="retry" type="button" hidden>Try again</button>
    </div>
  </div>
  <noscript>Turn on JavaScript in your browser to play CritterCare.</noscript>
  <script src="index.js"></script>
  <script>
    const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":459792,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
    const GODOT_THREADS_ENABLED = false;
    const engine = new Engine(GODOT_CONFIG);
    const canvas = document.getElementById('canvas');
    const loading = document.getElementById('loading');
    const progress = document.getElementById('progress');
    const notice = document.getElementById('notice');
    const retry = document.getElementById('retry');

    // Keep a held hamster attached to the pointer even at the canvas edge.
    canvas.addEventListener('pointerdown', (event) => {
      canvas.focus({ preventScroll: true });
      if (event.button === 0) {
        try { canvas.setPointerCapture(event.pointerId); } catch (_) {}
      }
    });
    canvas.addEventListener('contextmenu', (event) => event.preventDefault());
    canvas.addEventListener('keydown', (event) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(event.key)) event.preventDefault();
    });
    retry.addEventListener('click', () => window.location.reload());

    function showFailure(error) {
      console.error(error);
      document.getElementById('loading-label').textContent = "Pip couldn't open his room yet.";
      progress.hidden = true;
      notice.hidden = false;
      notice.textContent = error instanceof Error ? error.message : String(error);
      retry.hidden = false;
    }

    const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
    if (missing.length) {
      showFailure('This browser needs ' + missing.join(', ') + '. Try an up-to-date browser with hardware acceleration enabled.');
    } else {
      engine.startGame({
        onProgress(current, total) {
          if (total > 0) { progress.max = total; progress.value = current; }
          else { progress.removeAttribute('value'); }
        }
      }).then(() => {
        loading.remove();
        canvas.focus({ preventScroll: true });
      }).catch(showFailure);
    }
  </script>
</body>
</html>
